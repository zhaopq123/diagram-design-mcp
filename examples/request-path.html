<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WorkBuddy 图表 MCP：一次请求的链路</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper: #f5f5f5; --color-paper-2: #ececec; --color-ink: #2d3142; --color-ink-strong: #111111; --color-muted: #4f5d75; --color-soft: #5a6580; --color-rule: rgba(45,49,66,0.12); --color-rule-solid: #bfc0c0; --color-accent: #bf4520; --color-accent-tint: rgba(191,69,32,0.08); --color-link: #2e5aa8;
      --font-sans: 'Geist', system-ui, sans-serif;
      --font-serif: 'Instrument Serif', 'Noto Serif', 'Noto Serif KR', 'Noto Serif TC', serif;
      --font-mono: 'Geist Mono', ui-monospace, monospace;
    }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink);
      min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em;
      text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-serif); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400;
      letter-spacing: -0.02em; line-height: 1.15; color: var(--color-ink); margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 960px; display: block; }
    @media print { .diagram-container { overflow-x: visible; } svg { min-width: 0; } }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">architecture · Diagram Design</p>
    <h1>WorkBuddy 图表 MCP：一次请求的链路</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="workbuddy-图表-mcp-一次请求的链路-title workbuddy-图表-mcp-一次请求的链路-desc">
        <title id="workbuddy-图表-mcp-一次请求的链路-title">WorkBuddy 图表 MCP：一次请求的链路</title>
        <desc id="workbuddy-图表-mcp-一次请求的链路-desc">一次 diagram_check 调用从 WorkBuddy 会话经鉴权与分发抵达工具、并回写交付物的路径。</desc>
        <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="var(--color-muted)"/>
    </marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="var(--color-accent)"/>
    </marker>
    <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="var(--color-link)"/>
    </marker>
        </defs>

        <rect width="100%" height="100%" fill="var(--color-paper)"/>

        <!-- Arrows first, then nodes: lines must sit behind boxes. -->

        <!-- ── 连线先画：线必须落在盒子后面 ── -->
        <line x1="200" y1="292" x2="256" y2="292" stroke="var(--color-muted)" stroke-width="1" marker-end="url(#arrow)"/>
        <line x1="416" y1="292" x2="472" y2="292" stroke="var(--color-muted)" stroke-width="1" marker-end="url(#arrow)"/>
        <line x1="632" y1="292" x2="688" y2="292" stroke="var(--color-muted)" stroke-width="1" marker-end="url(#arrow)"/>
        <line x1="552" y1="336" x2="552" y2="440" stroke="var(--color-muted)" stroke-width="1" marker-end="url(#arrow)"/>
        <line x1="784" y1="336" x2="784" y2="440" stroke="var(--color-muted)" stroke-width="1" marker-end="url(#arrow)"/>

        <!-- 箭头标签：不透明遮罩 + 与描边留 8px 间隙，绝不压线 -->
        <rect class="label-mask" x="560" y="380" width="88" height="16" fill="var(--color-paper)"/>
        <text class="arrow-label" x="604" y="392" text-anchor="middle" font-family="'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" font-weight="500" fill="var(--color-muted)">按类型取数</text>

        <!-- ── 节点 ── -->
        <rect x="40" y="248" width="160" height="88" rx="6" fill="var(--color-soft)" fill-opacity="0.10" stroke="var(--color-soft)" stroke-width="1"/>
        <text x="120" y="288" text-anchor="middle" font-family="'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" font-weight="600" fill="var(--color-ink)">WorkBuddy 会话</text>
        <text x="120" y="308" text-anchor="middle" font-family="'Geist Mono',ui-monospace,monospace" font-size="9" fill="var(--color-soft)">tools/call</text>
        <rect x="256" y="248" width="160" height="88" rx="6" fill="var(--color-accent)" fill-opacity="0.08" stroke="var(--color-accent)" stroke-width="1.2"/>
        <text x="336" y="288" text-anchor="middle" font-family="'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" font-weight="600" fill="var(--color-ink)">Bearer 鉴权</text>
        <text x="336" y="308" text-anchor="middle" font-family="'Geist Mono',ui-monospace,monospace" font-size="9" fill="var(--color-soft)">:8400/mcp</text>
        <rect x="472" y="248" width="160" height="88" rx="6" fill="var(--color-paper)" stroke="var(--color-ink)" stroke-width="1"/>
        <text x="552" y="288" text-anchor="middle" font-family="'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" font-weight="600" fill="var(--color-ink)">会话 + 分发</text>
        <text x="552" y="308" text-anchor="middle" font-family="'Geist Mono',ui-monospace,monospace" font-size="9" fill="var(--color-soft)">Mcp-Session-Id</text>
        <rect x="688" y="248" width="192" height="88" rx="6" fill="var(--color-paper)" stroke="var(--color-ink)" stroke-width="1"/>
        <text x="784" y="288" text-anchor="middle" font-family="'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" font-weight="600" fill="var(--color-ink)">机械自检</text>
        <text x="784" y="308" text-anchor="middle" font-family="'Geist Mono',ui-monospace,monospace" font-size="9" fill="var(--color-soft)">diagram_check</text>
        <rect x="472" y="440" width="160" height="80" rx="6" fill="var(--color-ink)" fill-opacity="0.05" stroke="var(--color-muted)" stroke-width="1"/>
        <text x="552" y="480" text-anchor="middle" font-family="'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" font-weight="600" fill="var(--color-ink)">类型目录</text>
        <text x="552" y="500" text-anchor="middle" font-family="'Geist Mono',ui-monospace,monospace" font-size="9" fill="var(--color-soft)">catalog.json</text>
        <rect x="688" y="440" width="192" height="80" rx="6" fill="var(--color-ink)" fill-opacity="0.05" stroke="var(--color-muted)" stroke-width="1"/>
        <text x="784" y="480" text-anchor="middle" font-family="'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" font-weight="600" fill="var(--color-ink)">交付物</text>
        <text x="784" y="500" text-anchor="middle" font-family="'Geist Mono',ui-monospace,monospace" font-size="9" fill="var(--color-soft)">host writes .html</text>


    <!-- legend: horizontal bottom strip (never floating inside the diagram area) -->
    <line x1="40" y1="548" x2="920" y2="548" stroke="var(--color-rule)" stroke-width="1"/>
    <rect x="40" y="556" width="16" height="16" rx="2" fill="var(--color-soft)" stroke="var(--color-soft)" stroke-width="1"/>
    <text x="64" y="568" font-family="'Geist Mono', ui-monospace, monospace" font-size="8" letter-spacing="0.06em" fill="var(--color-muted)">输入</text>
    <rect x="100" y="556" width="16" height="16" rx="2" fill="var(--color-accent)" stroke="var(--color-accent)" stroke-width="1"/>
    <text x="124" y="568" font-family="'Geist Mono', ui-monospace, monospace" font-size="8" letter-spacing="0.06em" fill="var(--color-muted)">焦点（信任边界）</text>
    <rect x="192" y="556" width="16" height="16" rx="2" fill="var(--color-paper)" stroke="var(--color-ink)" stroke-width="1"/>
    <text x="216" y="568" font-family="'Geist Mono', ui-monospace, monospace" font-size="8" letter-spacing="0.06em" fill="var(--color-muted)">服务</text>
    <rect x="252" y="556" width="16" height="16" rx="2" fill="var(--color-ink)" stroke="var(--color-muted)" stroke-width="1"/>
    <text x="276" y="568" font-family="'Geist Mono', ui-monospace, monospace" font-size="8" letter-spacing="0.06em" fill="var(--color-muted)">数据 / 交付物</text>
      </svg>
    </div>
  </div>
</body>
</html>
