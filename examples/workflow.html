<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>画一张图的标准顺序</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper: #f5f5f5; --color-paper-2: #ececec; --color-ink: #2d3142; --color-ink-strong: #111111; --color-muted: #4f5d75; --color-soft: #5a6580; --color-rule: rgba(45,49,66,0.12); --color-rule-solid: #bfc0c0; --color-accent: #bf4520; --color-accent-tint: rgba(191,69,32,0.08); --color-link: #2e5aa8;
      --font-sans: 'Geist', system-ui, sans-serif;
      --font-serif: 'Instrument Serif', 'Noto Serif', 'Noto Serif KR', 'Noto Serif TC', serif;
      --font-mono: 'Geist Mono', ui-monospace, monospace;
    }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink);
      min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em;
      text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-serif); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400;
      letter-spacing: -0.02em; line-height: 1.15; color: var(--color-ink); margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 960px; display: block; }
    @media print { .diagram-container { overflow-x: visible; } svg { min-width: 0; } }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">flowchart · Diagram Design</p>
    <h1>画一张图的标准顺序</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="画一张图的标准顺序-title 画一张图的标准顺序-desc">
        <title id="画一张图的标准顺序-title">画一张图的标准顺序</title>
        <desc id="画一张图的标准顺序-desc">从选型到自检的五个步骤：先定类型，再定尺寸，取设计令牌，搭合规骨架，最后跑机械自检。</desc>
        <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="var(--color-muted)"/>
    </marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="var(--color-accent)"/>
    </marker>
    <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="var(--color-link)"/>
    </marker>
        </defs>

        <rect width="100%" height="100%" fill="var(--color-paper)"/>

        <!-- Arrows first, then nodes: lines must sit behind boxes. -->

        <!-- ── 连线先画：线必须落在盒子后面 ── -->
        <line x1="188" y1="320" x2="220" y2="320" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
        <line x1="372" y1="320" x2="404" y2="320" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
        <line x1="556" y1="320" x2="588" y2="320" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
        <line x1="740" y1="320" x2="772" y2="320" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>

        <!-- ── 节点 ── -->
        <rect x="36" y="280" width="152" height="80" rx="6" fill="rgba(79,93,117,0.10)" stroke="#5a6580" stroke-width="1"/>
        <text x="112" y="320" text-anchor="middle" font-family="'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" font-weight="600" fill="#2d3142">选型</text>
        <text x="112" y="340" text-anchor="middle" font-family="'Geist Mono',ui-monospace,monospace" font-size="9" fill="#5a6580">diagram_types</text>
        <rect x="220" y="280" width="152" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="296" y="320" text-anchor="middle" font-family="'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" font-weight="600" fill="#2d3142">定尺寸</text>
        <text x="296" y="340" text-anchor="middle" font-family="'Geist Mono',ui-monospace,monospace" font-size="9" fill="#5a6580">diagram_sizes</text>
        <rect x="404" y="280" width="152" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="480" y="320" text-anchor="middle" font-family="'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" font-weight="600" fill="#2d3142">取令牌</text>
        <text x="480" y="340" text-anchor="middle" font-family="'Geist Mono',ui-monospace,monospace" font-size="9" fill="#5a6580">diagram_tokens</text>
        <rect x="588" y="280" width="152" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="664" y="320" text-anchor="middle" font-family="'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" font-weight="600" fill="#2d3142">搭骨架</text>
        <text x="664" y="340" text-anchor="middle" font-family="'Geist Mono',ui-monospace,monospace" font-size="9" fill="#5a6580">diagram_scaffold</text>
        <rect x="772" y="280" width="152" height="80" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1.2"/>
        <text x="848" y="320" text-anchor="middle" font-family="'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" font-weight="600" fill="#2d3142">自检</text>
        <text x="848" y="340" text-anchor="middle" font-family="'Geist Mono',ui-monospace,monospace" font-size="9" fill="#5a6580">diagram_check</text>


    <!-- legend: horizontal bottom strip (never floating inside the diagram area) -->
    <line x1="40" y1="548" x2="920" y2="548" stroke="var(--color-rule)" stroke-width="1"/>
    <rect x="40" y="556" width="16" height="16" rx="2" fill="rgba(79,93,117,0.10)" stroke="#5a6580" stroke-width="1"/>
    <text x="64" y="568" font-family="'Geist Mono', ui-monospace, monospace" font-size="8" letter-spacing="0.06em" fill="var(--color-muted)">入口</text>
    <rect x="100" y="556" width="16" height="16" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <text x="124" y="568" font-family="'Geist Mono', ui-monospace, monospace" font-size="8" letter-spacing="0.06em" fill="var(--color-muted)">服务</text>
    <rect x="160" y="556" width="16" height="16" rx="2" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
    <text x="184" y="568" font-family="'Geist Mono', ui-monospace, monospace" font-size="8" letter-spacing="0.06em" fill="var(--color-muted)">质量关卡</text>
      </svg>
    </div>
  </div>
</body>
</html>
